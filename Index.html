<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te amo 3 milhões 💚</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Archivo de Estilos CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="relative min-h-screen pb-16">

    <!-- Fundo de Partículas e Números 09 Chiquitos -->
    <canvas id="bg-canvas"></canvas>

    <!-- Contenedor para las Frases Flotantes de 6 Segundos -->
    <div id="floating-words-container" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

    <!-- Conteúdo Principal -->
    <main class="relative z-10 max-w-3xl mx-auto px-4 pt-10 space-y-12">

        <!-- Banner Principal -->
        <section class="text-center space-y-4">
            <h1 class="text-4xl md:text-6xl font-title font-bold text-white tracking-wide leading-tight">
                Te amo <span class="text-green-500 neon-text-glow">3 milhões</span>
            </h1>
            
            <div class="inline-block px-6 py-2 rounded-full neon-border bg-black/60 text-green-400 font-title font-bold text-2xl tracking-widest">
                2019
            </div>
        </section>

        <!-- Unica Foto Principal -->
        <section class="flex justify-center">
            <div class="relative group max-w-sm w-full rounded-2xl overflow-hidden bg-cardBg neon-border p-2">
                <div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden">
                    <img id="main-photo" src="https://lh3.googleusercontent.com/d/1D3nurKo1HApRCZBgprWFtoFM6U-RqjKH" alt="Nossa Foto" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    <div class="absolute top-3 right-3 bg-black/60 backdrop-blur-md p-2 rounded-full border border-green-500/50 text-green-400 shadow-lg">
                        <i data-lucide="heart" class="w-5 h-5 fill-green-500"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- Player de Música Estilizado -->
        <section class="p-6 rounded-2xl bg-cardBg/90 backdrop-blur-md neon-border space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-green-500/20 flex items-center justify-center text-green-400 neon-border">
                        <i data-lucide="disc" class="w-6 h-6 animate-spin-slow"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="font-title font-semibold text-white text-base">Feliz Me Siento</h3>
                        <p class="text-xs text-gray-400">Gunda Merced y Su Salsa Fever</p>
                    </div>
                </div>
                <a href="https://youtu.be/w-rVk2j7aT4?si=pJoSrqo4Xz8Ehxfr" target="_blank" class="px-5 py-2.5 rounded-full bg-green-500 text-black font-semibold text-xs flex items-center gap-2 hover:bg-green-400 transition-all duration-300 transform hover:scale-105">
                    <i data-lucide="play" class="w-4 h-4 fill-black"></i>
                    <span>Ouvir Música</span>
                </a>
            </div>
        </section>

        <!-- Botão WhatsApp -->
        <section class="text-center space-y-4">
            <div class="flex justify-center gap-6 text-xs text-gray-400">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="person" value="chico" checked class="accent-green-500">
                    <span>Para Ela (Chico)</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="person" value="chica" class="accent-green-500">
                    <span>Para Ele (Chica)</span>
                </label>
            </div>

            <button onclick="sendSaudades()" class="inline-flex items-center gap-3 px-8 py-4 rounded-full bg-green-600/20 text-green-400 font-semibold neon-border hover:bg-green-600 hover:text-black transition-all duration-300 transform hover:scale-105 active:scale-95">
                <i data-lucide="message-circle" class="w-5 h-5"></i>
                <span>Sinto muito a sua falta 💚</span>
            </button>
        </section>

        <!-- Sección de Click (Corazón Gigante + Frases Flotantes) -->
        <section class="text-center space-y-6 pt-4">
            <div class="flex justify-center">
                <button onclick="handleClique()" class="px-8 py-3 rounded-full bg-green-500/10 text-green-400 neon-border hover:bg-green-500 hover:text-black font-semibold tracking-wider transition-all duration-300 flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    <span>Clique</span>
                </button>
            </div>

            <div class="flex justify-center items-center pt-2">
                <canvas id="heart-canvas" width="650" height="650" class="rounded-2xl bg-black/60 p-4 border border-green-500/30 w-full max-w-xl"></canvas>
            </div>
        </section>

        <!-- Frase Final em Português -->
        <section class="text-center pt-6 px-4">
            <p class="text-base md:text-lg font-title text-green-400 neon-text-glow leading-relaxed">
                Você não sabe o quão feliz me sinto toda vez que estou com você, te amo para sempre 💚
            </p>
        </section>

    </main>

    <!-- Archivo de Lógica JavaScript -->
    <script src="script.js"></script>
</body>
</html>
