<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Te amo 3 milhões 💚</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Archivo de Estilos CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="relative min-h-screen pb-16 bg-black text-gray-200 overflow-x-hidden">

    <!-- Fundo de Partículas e Números 09 Chiquitos -->
    <canvas id="bg-canvas"></canvas>

    <!-- Contenedor para las Frases Flotantes -->
    <div id="floating-words-container" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

    <!-- Conteúdo Principal -->
    <main class="relative z-10 max-w-2xl mx-auto px-4 pt-6 md:pt-10 space-y-8 md:space-y-12">

        <!-- Banner Principal -->
        <section class="text-center space-y-3 md:space-y-4">
            <h1 class="text-3xl sm:text-4xl md:text-6xl font-title font-bold text-white tracking-wide leading-tight">
                Te amo <span class="text-green-500 neon-text-glow">3 milhões</span>
            </h1>
            
            <div class="inline-block px-5 py-1.5 md:px-6 md:py-2 rounded-full neon-border bg-black/80 text-green-400 font-title font-bold text-xl md:text-2xl tracking-widest">
                2019
            </div>
        </section>

        <!-- Foto Principal Local -->
        <section class="flex justify-center">
            <div class="relative group w-full max-w-xs sm:max-w-sm rounded-2xl overflow-hidden bg-black/80 neon-border p-2">
                <div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden bg-gray-900 flex items-center justify-center">
                    <img id="main-photo" 
                         src="foto.jpg" 
                         alt="Nossa Foto" 
                         class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    <div class="absolute top-3 right-3 bg-black/70 backdrop-blur-md p-2 rounded-full border border-green-500/50 text-green-400 shadow-lg">
                        <i data-lucide="heart" class="w-5 h-5 fill-green-500"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- Player de Música Estilizado -->
        <section class="p-4 md:p-6 rounded-2xl bg-black/80 backdrop-blur-md neon-border space-y-4">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-green-500/20 flex items-center justify-center text-green-400 neon-border shrink-0">
                        <i data-lucide="disc" class="w-5 h-5 md:w-6 md:h-6 animate-spin-slow"></i>
                    </div>
                    <div class="text-left overflow-hidden">
                        <h3 class="font-title font-semibold text-white text-sm md:text-base truncate">Feliz Me Siento</h3>
                        <p class="text-[11px] md:text-xs text-gray-400 truncate">Gunda Merced y Su Salsa Fever</p>
                    </div>
                </div>
                <a href="https://youtu.be/w-rVk2j7aT4?si=pJoSrqo4Xz8Ehxfr" target="_blank" class="px-4 py-2 md:px-5 md:py-2.5 rounded-full bg-green-500 text-black font-semibold text-xs flex items-center gap-1.5 md:gap-2 hover:bg-green-400 transition-all duration-300 shrink-0">
                    <i data-lucide="play" class="w-3.5 h-3.5 md:w-4 md:h-4 fill-black"></i>
                    <span>Ouvir</span>
                </a>
            </div>
        </section>

        <!-- Botão WhatsApp -->
        <section class="text-center space-y-4">
            <div class="flex justify-center gap-6 text-xs text-gray-400">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="person" value="chico" checked class="accent-green-500">
                    <span>Para Ela (Chico)</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="person" value="chica" class="accent-green-500">
                    <span>Para Ele (Chica)</span>
                </label>
            </div>

            <button onclick="sendSaudades()" class="inline-flex items-center gap-3 px-6 py-3.5 md:px-8 md:py-4 rounded-full bg-green-600/20 text-green-400 font-semibold text-sm md:text-base neon-border hover:bg-green-600 hover:text-black transition-all duration-300 transform active:scale-95">
                <i data-lucide="message-circle" class="w-5 h-5"></i>
                <span>Sinto muito a sua falta 💚</span>
            </button>
        </section>

        <!-- Sección del Corazón Interactivo -->
        <section class="text-center space-y-4 pt-2">
            <div class="flex justify-center">
                <button onclick="handleClique()" class="px-7 py-2.5 md:px-8 md:py-3 rounded-full bg-green-500/10 text-green-400 neon-border hover:bg-green-500 hover:text-black font-semibold text-sm tracking-wider transition-all duration-300 flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    <span>Clique</span>
                </button>
            </div>

            <div class="flex justify-center items-center w-full">
                <div class="w-full max-w-sm sm:max-w-md rounded-2xl bg-black/90 p-2 md:p-4 border border-green-500/30">
                    <canvas id="heart-canvas" width="400" height="400" class="w-full h-auto block"></canvas>
                </div>
            </div>
        </section>

        <!-- Frase Final em Português -->
        <section class="text-center pt-4 px-2">
            <p class="text-sm sm:text-base md:text-lg font-title text-green-400 neon-text-glow leading-relaxed">
                Você não sabe o quão feliz me sinto toda vez que estou com você, te amo para sempre 💚
            </p>
        </section>

    </main>

    <!-- Archivo de Lógica JavaScript -->
    <script src="script.js"></script>
</body>
</html>
